<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Keyword Cluster Tool — Free SEO | Wealth Lab</title>
<meta name="description" content="Group related keywords into clusters for programmatic SEO. Free tool. No signup." />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f1f5f9; min-height: 100vh; padding: 40px 20px; }
  .container { max-width: 800px; margin: 0 auto; background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 16px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
  h1 { font-size: 26px; margin-bottom: 8px; letter-spacing: -0.5px; }
  h1 span { color: #22d3ee; }
  p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
  .field { margin-bottom: 24px; }
  .field label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 600; }
  .field textarea { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 16px; font-family: inherit; resize: vertical; min-height: 120px; }
  .field textarea:focus { outline: none; border-color: #22d3ee; }
  .cta { padding: 14px 24px; background: #22d3ee; color: #0f172a; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; }
  .cta:hover { background: #67e8f9; }
  .results { margin-top: 32px; display: none; }
  .results.show { display: block; animation: slideIn 0.4s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .results h3 { font-size: 15px; color: #22d3ee; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .cluster { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; }
  .cluster h4 { font-size: 14px; color: #22d3ee; margin-bottom: 8px; }
  .cluster ul { list-style: none; padding: 0; }
  .cluster li { font-size: 13px; color: #cbd5e1; margin-bottom: 4px; padding-left: 16px; position: relative; }
  .cluster li::before { content: "•"; color: #475569; position: absolute; left: 4px; }
  .copy-btn { background: #334155; color: #22d3ee; border: none; border-radius: 4px; padding: 6px 12px; font-size: 12px; cursor: pointer; float: right; margin-top: 8px; }
  .copy-btn:hover { background: #475569; }
  .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #334155; font-size: 11px; color: #64748b; text-align: center; }
  .footer a { color: #22d3ee; text-decoration: none; }
</style>
</head>
<body>
<div class="wl-back" style="max-width:860px;margin:0 auto 14px;font-size:13px;"><a href="../../index.html" style="color:#22d3ee;text-decoration:none;">&larr; All Wealth Lab tools</a></div>

<div class="container">
  <h1>Keyword <span>Cluster</span> Tool</h1>
  <p class="sub">Enter a list of keywords and group them into SEO clusters for programmatic content planning.</p>

  <div class="field">
    <label>Keywords (one per line)</label>
    <textarea id="keywords" placeholder="freelance rate calculator\ngraphic designer rate calculator\nconsultant rate calculator\nvirtual assistant rate calculator\nhow to price freelance work\nbest freelance rates 2026"></textarea>
  </div>

  <button class="cta" onclick="cluster()">Cluster Keywords</button>

  <div class="results" id="results">
    <h3>Keyword Clusters</h3>
    <div id="clusterList"></div>
    <button class="copy-btn" onclick="copyClusters()">Copy All Clusters</button>
  </div>

  <div class="footer">
    Built by <a href="../../index.html">Wealth Lab</a> — Free micro-tool.
  </div>
</div>

<script>
function cluster() {
  const input = document.getElementById("keywords").value.trim();
  const results = document.getElementById("results");
  const clusterList = document.getElementById("clusterList");

  if (!input) {
    alert("Please enter keywords.");
    return;
  }

  const keywords = input.split("\n").map(k => k.trim()).filter(k => k.length > 0);

  // Simple clustering by first word
  const clusters = {};
  keywords.forEach(kw => {
    const firstWord = kw.split(" ")[0].toLowerCase();
    if (!clusters[firstWord]) clusters[firstWord] = [];
    clusters[firstWord].push(kw);
  });

  clusterList.innerHTML = "";
  Object.entries(clusters).forEach(([clusterName, kws]) => {
    const cluster = document.createElement("div");
    cluster.className = "cluster";
    cluster.innerHTML = `
      <h4>${clusterName} (${kws.length})</h4>
      <ul>${kws.map(kw => `<li>${kw}</li>`).join("")}</ul>
    `;
    clusterList.appendChild(cluster);
  });

  results.classList.add("show");
}

function copyClusters() {
  const text = document.getElementById("clusterList").innerText;
  navigator.clipboard.writeText(text);
  alert("Clusters copied to clipboard.");
}
</script>

</body>
</html>
