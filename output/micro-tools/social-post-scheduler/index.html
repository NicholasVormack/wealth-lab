<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Social Post Scheduler — Free | Wealth Lab</title>
<meta name="description" content="Plan and format social media posts for X, LinkedIn, and Reddit. Free scheduling helper. No signup." />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f1f5f9; min-height: 100vh; padding: 40px 20px; }
  .container { max-width: 700px; margin: 0 auto; background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 16px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
  h1 { font-size: 26px; margin-bottom: 8px; letter-spacing: -0.5px; }
  h1 span { color: #22d3ee; }
  p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 600; }
  .field textarea, .field input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 16px; font-family: inherit; }
  .field textarea { resize: vertical; min-height: 100px; }
  .field textarea:focus, .field input:focus { outline: none; border-color: #22d3ee; }
  .char-count { font-size: 11px; color: #64748b; margin-top: 4px; text-align: right; }
  .platform-select { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 16px; margin-bottom: 20px; }
  .cta { padding: 14px 24px; background: #22d3ee; color: #0f172a; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; }
  .cta:hover { background: #67e8f9; }
  .results { margin-top: 32px; display: none; }
  .results.show { display: block; animation: slideIn 0.4s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .platform-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; }
  .platform-card h3 { font-size: 14px; color: #22d3ee; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .platform-card p { font-size: 14px; color: #cbd5e1; line-height: 1.5; }
  .platform-card .char-info { font-size: 11px; color: #64748b; margin-top: 6px; }
  .copy-btn { background: #334155; color: #22d3ee; border: none; border-radius: 4px; padding: 6px 12px; font-size: 12px; cursor: pointer; float: right; margin-top: 8px; }
  .copy-btn:hover { background: #475569; }
  .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #334155; font-size: 11px; color: #64748b; text-align: center; }
  .footer a { color: #22d3ee; text-decoration: none; }
</style>
</head>
<body>
<div class="wl-back" style="max-width:860px;margin:0 auto 14px;font-size:13px;"><a href="../../index.html" style="color:#22d3ee;text-decoration:none;">&larr; All Wealth Lab tools</a></div>

<div class="container">
  <h1>Social <span>Post</span> Scheduler</h1>
  <p class="sub">Write one post and format it for X (Twitter), LinkedIn, and Reddit with character counts and best practices.</p>

  <select class="platform-select" id="platform">
    <option value="all">All Platforms</option>
    <option value="x">X (Twitter)</option>
    <option value="linkedin">LinkedIn</option>
    <option value="reddit">Reddit</option>
  </select>

  <div class="field">
    <label>Your post content</label>
    <textarea id="content" placeholder="Write your social media post here..."></textarea>
    <div class="char-count" id="charCount">0 characters</div>
  </div>

  <div class="field">
    <label>Link to include (optional)</label>
    <input type="text" id="link" placeholder="https://wealth-lab.github.io/tool-name/" />
  </div>

  <button class="cta" onclick="format()">Format for All Platforms</button>

  <div class="results" id="results">
    <div class="platform-card" id="cardX">
      <h3>X (Twitter)</h3>
      <p id="postX"></p>
      <div class="char-info" id="infoX"></div>
      <button class="copy-btn" onclick="copyPost('postX')">Copy</button>
    </div>
    <div class="platform-card" id="cardLinkedIn">
      <h3>LinkedIn</h3>
      <p id="postLinkedIn"></p>
      <div class="char-info" id="infoLinkedIn"></div>
      <button class="copy-btn" onclick="copyPost('postLinkedIn')">Copy</button>
    </div>
    <div class="platform-card" id="cardReddit">
      <h3>Reddit</h3>
      <p id="postReddit"></p>
      <div class="char-info" id="infoReddit"></div>
      <button class="copy-btn" onclick="copyPost('postReddit')">Copy</button>
    </div>
  </div>

  <div class="footer">
    Built by <a href="../../index.html">Wealth Lab</a> — Free micro-tool.
  </div>
</div>

<script>
const contentEl = document.getElementById("content");
const charCount = document.getElementById("charCount");

contentEl.addEventListener("input", () => {
  charCount.textContent = `${contentEl.value.length} characters`;
});

const limits = { x: 280, linkedin: 3000, reddit: 40000 };

function format() {
  const content = contentEl.value.trim();
  const link = document.getElementById("link").value.trim();
  const platform = document.getElementById("platform").value;
  const results = document.getElementById("results");

  if (!content) {
    alert("Please enter post content.");
    return;
  }

  const fullContent = link ? `${content}\n\n${link}` : content;

  // X (Twitter)
  const xPost = fullContent.length > 280 ? fullContent.substring(0, 277) + "..." : fullContent;
  document.getElementById("postX").textContent = xPost;
  document.getElementById("infoX").textContent = `${xPost.length}/280 characters ${xPost.length > 280 ? "(truncated)" : ""}`;
  document.getElementById("cardX").style.borderColor = xPost.length > 280 ? "#ef4444" : "#22d3ee";

  // LinkedIn
  const linkedInPost = fullContent;
  document.getElementById("postLinkedIn").textContent = linkedInPost;
  document.getElementById("infoLinkedIn").textContent = `${linkedInPost.length}/3000 characters`;
  document.getElementById("cardLinkedIn").style.borderColor = "#22d3ee";

  // Reddit
  const redditPost = fullContent;
  document.getElementById("postReddit").textContent = redditPost;
  document.getElementById("infoReddit").textContent = `${redditPost.length}/40000 characters`;
  document.getElementById("cardReddit").style.borderColor = "#22d3ee";

  // Show/hide based on platform selection
  document.getElementById("cardX").style.display = platform === "all" || platform === "x" ? "block" : "none";
  document.getElementById("cardLinkedIn").style.display = platform === "all" || platform === "linkedin" ? "block" : "none";
  document.getElementById("cardReddit").style.display = platform === "all" || platform === "reddit" ? "block" : "none";

  results.classList.add("show");
}

function copyPost(elementId) {
  const text = document.getElementById(elementId).textContent;
  navigator.clipboard.writeText(text);
  const btn = document.querySelector(`#${elementId}`).parentElement.querySelector(".copy-btn") || event.target;
  const original = btn.textContent;
  btn.textContent = "Copied!";
  setTimeout(() => btn.textContent = original, 1000);
}
</script>

</body>
</html>
