<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blog Post Outline Generator — Free | Wealth Lab</title>
<meta name="description" content="Generate SEO-optimized blog post outlines with H1, H2, H3 structure. Free tool for content creators." />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f1f5f9; min-height: 100vh; padding: 40px 20px; }
  .container { max-width: 700px; margin: 0 auto; background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 16px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
  h1 { font-size: 26px; margin-bottom: 8px; letter-spacing: -0.5px; }
  h1 span { color: #22d3ee; }
  p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
  .field { margin-bottom: 24px; }
  .field label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 600; }
  .field input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 16px; }
  .field input:focus { outline: none; border-color: #22d3ee; }
  .cta { padding: 14px 24px; background: #22d3ee; color: #0f172a; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; }
  .cta:hover { background: #67e8f9; }
  .results { margin-top: 32px; display: none; }
  .results.show { display: block; animation: slideIn 0.4s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .results h3 { font-size: 15px; color: #22d3ee; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .outline-item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 14px 18px; margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
  .outline-item b { color: #22d3ee; }
  .outline-item .sub { font-size: 12px; color: #64748b; margin-top: 4px; }
  .copy-btn { background: #334155; color: #22d3ee; border: none; border-radius: 4px; padding: 6px 12px; font-size: 12px; cursor: pointer; float: right; margin-top: 8px; }
  .copy-btn:hover { background: #475569; }
  .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #334155; font-size: 11px; color: #64748b; text-align: center; }
  .footer a { color: #22d3ee; text-decoration: none; }
</style>
</head>
<body>
<div class="wl-back" style="max-width:860px;margin:0 auto 14px;font-size:13px;"><a href="../../index.html" style="color:#22d3ee;text-decoration:none;">&larr; All Wealth Lab tools</a></div>

<div class="container">
  <h1>Blog Post <span>Outline</span> Generator</h1>
  <p class="sub">Enter your topic and get a complete SEO outline with H1, H2, H3 structure and FAQ section.</p>

  <div class="field">
    <label>Blog post topic</label>
    <input type="text" id="topic" placeholder="How to start a side hustle with $0" />
  </div>

  <button class="cta" onclick="generate()">Generate Outline</button>

  <div class="results" id="results">
    <h3>SEO Outline</h3>
    <div id="outlineContent"></div>
    <button class="copy-btn" onclick="copyOutline()">Copy Outline</button>
  </div>

  <div class="footer">
    Built by <a href="../../index.html">Wealth Lab</a> — Free micro-tool.
  </div>
</div>

<script>
function generate() {
  const topic = document.getElementById("topic").value.trim();
  const results = document.getElementById("results");
  const content = document.getElementById("outlineContent");

  if (!topic) {
    alert("Please enter a topic.");
    return;
  }

  const capitalized = topic.charAt(0).toUpperCase() + topic.slice(1);

  const outline = `
# H1: ${capitalized} — Complete Guide for 2026

## Introduction
- Hook: The problem your reader faces
- Promise: What they'll learn by the end
- Credibility: Brief example or stat

## H2: What Is ${capitalized}?
- Simple definition
- Why it matters in 2026
- Who it's for

## H2: How ${capitalized} Works
- Step 1: Get started
- Step 2: Set up your system
- Step 3: Execute consistently

## H2: Free Tools for ${capitalized}
- Tool 1: What it does and why it's free
- Tool 2: Alternative option
- Tool 3: Bonus resource

## H2: Common Mistakes to Avoid
- Mistake 1: Trying to do too much at once
- Mistake 2: Giving up too early
- Mistake 3: Not tracking results

## H2: Realistic Expectations
- Timeline to first results
- Income potential (honest range)
- Time commitment required

## H2: Frequently Asked Questions
- Q: Can I really do this with $0?
- Q: How long until I see results?
- Q: Do I need any special skills?

## H2: Conclusion
- Recap of key points
- Call to action: Start today with one small step
- Link to related tool/resource

---

**SEO Notes:**
- Primary keyword: ${topic}
- Target word count: 1,500–2,000 words
- Include internal links to related articles
- Add meta description: Learn how to ${topic.toLowerCase()} with free tools and zero dollars upfront.
  `;

  content.textContent = outline;
  results.classList.add("show");
}

function copyOutline() {
  const text = document.getElementById("outlineContent").textContent;
  navigator.clipboard.writeText(text);
  alert("Outline copied to clipboard.");
}
</script>

</body>
</html>
