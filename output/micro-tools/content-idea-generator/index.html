<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Content Idea Generator — Free | Wealth Lab</title>
<meta name="description" content="Generate SEO content ideas for your niche. Free tool for bloggers, YouTubers, and social media creators." />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f1f5f9; min-height: 100vh; padding: 40px 20px; }
  .container { max-width: 700px; margin: 0 auto; background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 16px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
  h1 { font-size: 26px; margin-bottom: 8px; letter-spacing: -0.5px; }
  h1 span { color: #22d3ee; }
  p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
  .field { margin-bottom: 24px; }
  .field label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 600; }
  .field input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 16px; }
  .field input:focus { outline: none; border-color: #22d3ee; }
  .cta { padding: 14px 24px; background: #22d3ee; color: #0f172a; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; }
  .cta:hover { background: #67e8f9; }
  .results { margin-top: 32px; display: none; }
  .results.show { display: block; animation: slideIn 0.4s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .results h3 { font-size: 15px; color: #22d3ee; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  ul.ideas { list-style: none; padding: 0; }
  ul.ideas li { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
  ul.ideas li b { color: #22d3ee; }
  .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #334155; font-size: 11px; color: #64748b; text-align: center; }
  .footer a { color: #22d3ee; text-decoration: none; }
</style>
</head>
<body>
<div class="wl-back" style="max-width:860px;margin:0 auto 14px;font-size:13px;"><a href="../../index.html" style="color:#22d3ee;text-decoration:none;">&larr; All Wealth Lab tools</a></div>

<div class="container">
  <h1>Content <span>Idea</span> Generator</h1>
  <p class="sub">Enter your niche and get SEO-optimized content ideas for blogs, videos, and social media.</p>

  <div class="field">
    <label>Your niche or topic</label>
    <input type="text" id="niche" placeholder="e.g., side hustles, fitness, personal finance" />
  </div>

  <button class="cta" onclick="generate()">Generate Ideas</button>

  <div class="results" id="results">
    <h3>Content Ideas</h3>
    <ul class="ideas" id="ideasList"></ul>
  </div>

  <div class="footer">
    Built by <a href="../../index.html">Wealth Lab</a> — Free micro-tool.
  </div>
</div>

<script>
const templates = [
  "How to start {niche} with $0",
  "7 free tools for {niche} beginners",
  "{niche}: complete beginner's guide (2026)",
  "5 mistakes to avoid in {niche}",
  "Best {niche} calculators and resources",
  "How to monetize {niche} as a side hustle",
  "{niche} vs alternatives: which is better?",
  "Free {niche} templates you can use today",
  "Step-by-step {niche} tutorial for $0",
  "Realistic income from {niche}: honest breakdown"
];

function generate() {
  const niche = document.getElementById("niche").value.trim();
  const results = document.getElementById("results");
  const list = document.getElementById("ideasList");

  if (!niche) {
    alert("Please enter a niche or topic.");
    return;
  }

  list.innerHTML = "";
  templates.forEach(t => {
    const li = document.createElement("li");
    li.innerHTML = t.replace(/\{niche\}/g, `<b>${niche}</b>`);
    list.appendChild(li);
  });

  results.classList.add("show");
}
</script>

</body>
</html>
