<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Product Idea Validator — Free | Wealth Lab</title>
<meta name="description" content="Validate your product or service idea before building. Free validation tool with scoring." />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f1f5f9; min-height: 100vh; padding: 40px 20px; }
  .container { max-width: 700px; margin: 0 auto; background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 16px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
  h1 { font-size: 26px; margin-bottom: 8px; letter-spacing: -0.5px; }
  h1 span { color: #22d3ee; }
  p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 600; }
  .field input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 16px; }
  .field input:focus { outline: none; border-color: #22d3ee; }
  .field select { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 16px; }
  .field select:focus { outline: none; border-color: #22d3ee; }
  .cta { margin-top: 24px; padding: 14px 24px; background: #22d3ee; color: #0f172a; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; }
  .cta:hover { background: #67e8f9; }
  .results { margin-top: 32px; display: none; }
  .results.show { display: block; animation: slideIn 0.4s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .score-card { display: flex; gap: 16px; margin-bottom: 20px; }
  .score-item { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; text-align: center; }
  .score-item .value { font-size: 32px; font-weight: 800; color: #22d3ee; }
  .score-item .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
  .verdict { background: #0f172a; border: 2px solid #22d3ee; border-radius: 12px; padding: 24px; margin-bottom: 20px; text-align: center; }
  .verdict h3 { font-size: 20px; color: #22d3ee; margin-bottom: 8px; }
  .verdict p { color: #cbd5e1; font-size: 14px; }
  .insights { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px 20px; }
  .insights h4 { font-size: 14px; color: #22d3ee; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .insights ul { list-style: none; padding: 0; }
  .insights li { font-size: 13px; color: #cbd5e1; margin-bottom: 8px; padding-left: 18px; position: relative; }
  .insights li::before { content: "•"; color: #475569; position: absolute; left: 4px; }
  .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #334155; font-size: 11px; color: #64748b; text-align: center; }
  .footer a { color: #22d3ee; text-decoration: none; }
</style>
</head>
<body>
<div class="wl-back" style="max-width:860px;margin:0 auto 14px;font-size:13px;"><a href="../../index.html" style="color:#22d3ee;text-decoration:none;">&larr; All Wealth Lab tools</a></div>

<div class="container">
  <h1>Product <span>Idea</span> Validator</h1>
  <p class="sub">Score your product or service idea before you build it. Get honest feedback on viability.</p>

  <div class="field">
    <label>Your idea (one sentence)</label>
    <input type="text" id="idea" placeholder="A free calculator for freelance rates" />
  </div>
  <div class="field">
    <label>Who is it for? (target audience)</label>
    <input type="text" id="audience" placeholder="Freelancers who struggle with pricing" />
  </div>
  <div class="field">
    <label>What problem does it solve?</label>
    <input type="text" id="problem" placeholder="They don't know what to charge clients" />
  </div>
  <div class="field">
    <label>Are people already paying for similar solutions?</label>
    <select id="market">
      <option value="yes">Yes — there are paid competitors</option>
      <option value="some">Some — a few free alternatives exist</option>
      <option value="no">No — this is a new idea</option>
    </select>
  </div>
  <div class="field">
    <label>Can you build it in under 10 hours?</label>
    <select id="build">
      <option value="yes">Yes — I can build it quickly</option>
      <option value="some">Maybe — it will take 10–40 hours</option>
      <option value="no">No — it needs significant development</option>
    </select>
  </div>

  <button class="cta" onclick="validate()">Validate Idea</button>

  <div class="results" id="results">
    <div class="verdict">
      <h3 id="verdictText">Validating...</h3>
      <p id="verdictDesc"></p>
    </div>
    <div class="score-card">
      <div class="score-item">
        <div class="value" id="overallScore">0</div>
        <div class="label">Overall Score /100</div>
      </div>
      <div class="score-item">
        <div class="value" id="marketScore">0</div>
        <div class="label">Market Demand</div>
      </div>
      <div class="score-item">
        <div class="value" id="buildScore">0</div>
        <div class="label">Build Speed</div>
      </div>
    </div>
    <div class="insights">
      <h4>Next Steps</h4>
      <ul id="insightsList"></ul>
    </div>
  </div>

  <div class="footer">
    Built by <a href="../../index.html">Wealth Lab</a> — Free micro-tool.
  </div>
</div>

<script>
function validate() {
  const idea = document.getElementById("idea").value.trim();
  const audience = document.getElementById("audience").value.trim();
  const problem = document.getElementById("problem").value.trim();
  const market = document.getElementById("market").value;
  const build = document.getElementById("build").value;

  const results = document.getElementById("results");
  const verdictText = document.getElementById("verdictText");
  const verdictDesc = document.getElementById("verdictDesc");
  const overallScore = document.getElementById("overallScore");
  const marketScore = document.getElementById("marketScore");
  const buildScore = document.getElementById("buildScore");
  const insightsList = document.getElementById("insightsList");

  if (!idea || !audience || !problem) {
    alert("Please fill in all fields.");
    return;
  }

  let score = 50;
  const insights = [];

  // Market scoring
  let marketPts = 0;
  if (market === "yes") {
    marketPts = 40;
    insights.push("Market validation: Paid competitors exist — people are willing to pay for this type of solution.");
  } else if (market === "some") {
    marketPts = 25;
    insights.push("Market validation: Some free alternatives exist — there's room for a better paid version.");
  } else {
    marketPts = 10;
    insights.push("Market validation: No existing solutions — either you're first or there's no demand. Validate with potential users first.");
  }

  // Build scoring
  let buildPts = 0;
  if (build === "yes") {
    buildPts = 40;
    insights.push("Build speed: You can build this quickly — low time investment to test.");
  } else if (build === "some") {
    buildPts = 20;
    insights.push("Build speed: Moderate build time — consider building an MVP first.");
  } else {
    buildPts = 5;
    insights.push("Build speed: High development time — consider simplifying or finding a no-code alternative.");
  }

  // Idea clarity bonus
  if (idea.length > 20 && audience.length > 10 && problem.length > 10) {
    score += 10;
    insights.push("Idea clarity: You clearly defined what, who, and why — good foundation.");
  } else {
    insights.push("Idea clarity: Consider making your idea more specific before building.");
  }

  score = Math.round(marketPts + buildPts + (idea.length > 20 ? 10 : 0));
  score = Math.min(score, 100);

  let verdict = "Build It";
  let verdictColor = "#22c55e";
  if (score < 50) {
    verdict = "Pivot or Validate First";
    verdictColor = "#f59e0b";
  } else if (score < 70) {
    verdict = "Build MVP Only";
    verdictColor = "#f59e0b";
  }

  overallScore.textContent = score;
  marketScore.textContent = marketPts + "/40";
  buildScore.textContent = buildPts + "/40";
  verdictText.textContent = verdict;
  verdictText.style.color = verdictColor;
  verdictDesc.textContent = score >= 70 ? "Strong signal — proceed with building." : score >= 50 ? "Mixed signal — validate with potential users before building." : "Weak signal — reconsider the idea or find more market demand.";

  insightsList.innerHTML = insights.map(i => `<li>${i}</li>`).join("");
  results.classList.add("show");
}
</script>

</body>
</html>
