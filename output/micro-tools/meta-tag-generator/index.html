<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meta Tag Generator — Free SEO Tool | Wealth Lab</title>
<meta name="description" content="Generate SEO meta tags (title, description, Open Graph, Twitter cards) for your web pages. Free tool." />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f1f5f9; min-height: 100vh; padding: 40px 20px; }
  .container { max-width: 800px; margin: 0 auto; background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 16px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
  h1 { font-size: 26px; margin-bottom: 8px; letter-spacing: -0.5px; }
  h1 span { color: #22d3ee; }
  p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 600; }
  .field input, .field textarea { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 15px; font-family: inherit; }
  .field input:focus, .field textarea:focus { outline: none; border-color: #22d3ee; }
  .field textarea { resize: vertical; min-height: 80px; }
  .cta { padding: 14px 24px; background: #22d3ee; color: #0f172a; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; margin-bottom: 24px; }
  .cta:hover { background: #67e8f9; }
  .output { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 20px; font-family: "Courier New", monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; display: none; }
  .output.show { display: block; animation: slideIn 0.4s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .copy-btn { background: #334155; color: #22d3ee; border: none; border-radius: 4px; padding: 6px 12px; font-size: 12px; cursor: pointer; margin-top: 12px; float: right; }
  .copy-btn:hover { background: #475569; }
  .char-count { font-size: 11px; color: #64748b; margin-top: 4px; text-align: right; }
  .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #334155; font-size: 11px; color: #64748b; text-align: center; }
  .footer a { color: #22d3ee; text-decoration: none; }
</style>
</head>
<body>
<div class="wl-back" style="max-width:860px;margin:0 auto 14px;font-size:13px;"><a href="../../index.html" style="color:#22d3ee;text-decoration:none;">&larr; All Wealth Lab tools</a></div>

<div class="container">
  <h1>Meta <span>Tag</span> Generator</h1>
  <p class="sub">Generate complete SEO meta tags including Open Graph and Twitter Card markup.</p>

  <div class="field">
    <label>Page Title (max 60 chars)</label>
    <input type="text" id="title" placeholder="Free Side Hustle Calculator | Wealth Lab" maxlength="60" />
    <div class="char-count" id="titleCount">0/60</div>
  </div>
  <div class="field">
    <label>Meta Description (max 160 chars)</label>
    <textarea id="description" maxlength="160" placeholder="Calculate your side hustle profit in seconds. Free tool, no signup."></textarea>
    <div class="char-count" id="descCount">0/160</div>
  </div>
  <div class="field">
    <label>Page URL</label>
    <input type="text" id="url" placeholder="https://wealth-lab.github.io/tool-name/" />
  </div>
  <div class="field">
    <label>Site Name</label>
    <input type="text" id="siteName" placeholder="Wealth Lab" />
  </div>
  <div class="field">
    <label>Twitter Handle (optional)</label>
    <input type="text" id="twitter" placeholder="@wealthlab" />
  </div>

  <button class="cta" onclick="generate()">Generate Meta Tags</button>

  <div class="output" id="output"></div>

  <div class="footer">
    Built by <a href="../../index.html">Wealth Lab</a> — Free micro-tool.
  </div>
</div>

<script>
const titleEl = document.getElementById("title");
const descEl = document.getElementById("description");
const titleCount = document.getElementById("titleCount");
const descCount = document.getElementById("descCount");

titleEl.addEventListener("input", () => {
  titleCount.textContent = `${titleEl.value.length}/60`;
  titleCount.style.color = titleEl.value.length > 60 ? "#ef4444" : "#64748b";
});
descEl.addEventListener("input", () => {
  descCount.textContent = `${descEl.value.length}/160`;
  descCount.style.color = descEl.value.length > 160 ? "#ef4444" : "#64748b";
});

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function generate() {
  const title = titleEl.value.trim();
  const desc = descEl.value.trim();
  const url = document.getElementById("url").value.trim();
  const siteName = document.getElementById("siteName").value.trim();
  const twitter = document.getElementById("twitter").value.trim();

  if (!title || !desc || !url) {
    alert("Please fill in Title, Description, and URL.");
    return;
  }

  const ogTitle = escapeHtml(title);
  const ogDesc = escapeHtml(desc);
  const ogUrl = escapeHtml(url);
  const ogSite = escapeHtml(siteName || "Wealth Lab");
  const twitterHandle = twitter ? escapeHtml(twitter) : "";

  const tags = `<!DOCTYPE html>
<html>
<head>
  <!-- Basic Meta Tags -->
  <title>${ogTitle}</title>
  <meta name="description" content="${ogDesc}">
  <meta name="author" content="${ogSite}">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="${ogUrl}">
  <meta property="og:title" content="${ogTitle}">
  <meta property="og:description" content="${ogDesc}">
  <meta property="og:site_name" content="${ogSite}">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="${ogUrl}">
  <meta property="twitter:title" content="${ogTitle}">
  <meta property="twitter:description" content="${ogDesc}">
  ${twitterHandle ? `<meta property="twitter:creator" content="${twitterHandle}">` : ""}
</head>
<body>
  <!-- Your page content here -->
</body>
</html>`;

  document.getElementById("output").textContent = tags;
  document.getElementById("output").classList.add("show");
}
</script>

</body>
</html>
