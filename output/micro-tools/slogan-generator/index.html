<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Slogan Generator — Free | Wealth Lab</title>
<meta name="description" content="Generate catchy slogans for print-on-demand products, brands, and side hustles. Free tool. No signup." />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f1f5f9; min-height: 100vh; padding: 40px 20px; }
  .container { max-width: 700px; margin: 0 auto; background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 16px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
  h1 { font-size: 26px; margin-bottom: 8px; letter-spacing: -0.5px; }
  h1 span { color: #22d3ee; }
  p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
  .field { margin-bottom: 24px; }
  .field label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 600; }
  .field input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 16px; }
  .field input:focus { outline: none; border-color: #22d3ee; }
  .cta { padding: 14px 24px; background: #22d3ee; color: #0f172a; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; }
  .cta:hover { background: #67e8f9; }
  .results { margin-top: 32px; display: none; }
  .results.show { display: block; animation: slideIn 0.4s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .slogan-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 18px 22px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .slogan-text { font-size: 16px; color: #f1f5f9; font-style: italic; flex: 1; }
  .copy-btn { background: #334155; color: #22d3ee; border: none; border-radius: 4px; padding: 6px 12px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .copy-btn:hover { background: #475569; }
  .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #334155; font-size: 11px; color: #64748b; text-align: center; }
  .footer a { color: #22d3ee; text-decoration: none; }
</style>
</head>
<body>
<div class="wl-back" style="max-width:860px;margin:0 auto 14px;font-size:13px;"><a href="../../index.html" style="color:#22d3ee;text-decoration:none;">&larr; All Wealth Lab tools</a></div>

<div class="container">
  <h1>Slogan <span>Generator</span></h1>
  <p class="sub">Generate catchy slogans for print-on-demand products, brands, and side hustles. Free tool. No signup.</p>

  <div class="field">
    <label>Your niche or product</label>
    <input type="text" id="niche" placeholder="Coffee mugs, fitness apparel, gaming, cats" />
  </div>
  <div class="field">
    <label>Vibe</label>
    <select id="vibe" style="width:100%;padding:12px 16px;background:#0f172a;border:1px solid #475569;border-radius:8px;color:#fff;font-size:16px;">
      <option value="funny">Funny</option>
      <option value="inspirational">Inspirational</option>
      <option value="sarcastic">Sarcastic</option>
      <option value="minimalist">Minimalist</option>
      <option value="bold">Bold</option>
    </select>
  </div>

  <button class="cta" onclick="generate()">Generate Slogans</button>

  <div class="results" id="results">
    <h3 style="color:#22d3ee; margin-bottom:16px; text-transform:uppercase; letter-spacing:1px; font-size:14px;">Your Slogans</h3>
    <div id="slogansOutput"></div>
  </div>

  <div class="footer">
    Built by <a href="../../index.html">Wealth Lab</a> — Free micro-tool.
  </div>
</div>

<script>
const templates = {
  funny: [
    "I {verb} {noun} and I know things",
    "This is my {noun} shirt",
    "I survived {noun} and all I got was this lousy shirt",
    "Professional {noun} vibes only",
    "My {noun} addiction is showing",
    "Not today, {noun}",
    "{noun} problems",
    "Born to {verb}, forced to {noun}",
    "I {verb} more than I sleep",
    "Sarcasm loading... please wait"
  ],
  inspirational: [
    "Dream {verb}, achieve {noun}",
    "Your {noun}, your rules",
    "Make {noun} happen",
    "Believe in your {noun}",
    "The {noun} within you",
    "Create your own {noun}",
    "One {noun} at a time",
    "Your {noun} journey starts here",
    "Rise and {verb}",
    "Own your {noun}"
  ],
  sarcastic: [
    "I'm not arguing, I'm just explaining why I'm right about {noun}",
    "I have {noun} issues",
    "My {noun} is better than yours",
    "I'm not lazy, I'm on {noun} mode",
    "This shirt supports my {noun} habit",
    "I need more {noun}",
    "{noun}: because adulting is hard",
    "I do what I want about {noun}",
    "My {noun} is my personality",
    "Warning: {noun} enthusiast"
  ],
  minimalist: [
    "Just {noun}.",
    "Less {noun}, more living.",
    "{noun} only.",
    "Pure {noun}.",
    "Essential {noun}.",
    "Simple {noun}.",
    "Clean {noun}.",
    "Quiet {noun}.",
    "Bold {noun}.",
    "True {noun}."
  ],
  bold: [
    "Own your {noun}",
    "{noun} first",
    "No limits on {noun}",
    "{noun} unstoppable",
    "Rule your {noun}",
    "Command your {noun}",
    "{noun} revolution",
    "Break the {noun}",
    "Defy {noun}",
    "Master your {noun}"
  ]
};

const verbs = ["crush", "slay", "own", "dominate", "rule", "master", "love", "live", "breathe", "chase"];
const nouns = ["coffee", "fitness", "gaming", "cats", "dogs", "travel", "music", "art", "food", "books", "yoga", "coding", "music", "nature", "adventure"];

function generate() {
  const niche = document.getElementById("niche").value.trim();
  const vibe = document.getElementById("vibe").value;

  const results = document.getElementById("results");
  const output = document.getElementById("slogansOutput");

  if (!niche) {
    alert("Please enter your niche or product.");
    return;
  }

  output.innerHTML = "";
  results.classList.add("show");

  const tmpls = templates[vibe] || templates.funny;

  for (let i = 0; i < 10; i++) {
    let slogan = tmpls[Math.floor(Math.random() * tmpls.length)];
    slogan = slogan.replace("{verb}", verbs[Math.floor(Math.random() * verbs.length)]);
    slogan = slogan.replace("{noun}", niche);
    slogan = slogan.charAt(0).toUpperCase() + slogan.slice(1);

    const div = document.createElement("div");
    div.className = "slogan-card";
    div.innerHTML = `<span class="slogan-text">"${slogan}"</span><button class="copy-btn" onclick="copySlogan(this)">Copy</button>`;
    output.appendChild(div);
  }
}

function copySlogan(btn) {
  const text = btn.parentElement.querySelector(".slogan-text").textContent;
  navigator.clipboard.writeText(text);
  const original = btn.textContent;
  btn.textContent = "Copied!";
  setTimeout(() => btn.textContent = original, 1000);
}
</script>

</body>
</html>
