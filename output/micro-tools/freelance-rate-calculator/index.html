<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Freelance Hourly Rate Calculator — Free | Wealth Lab</title>
<meta name="description" content="Calculate your ideal freelance hourly rate based on expenses, taxes, and profit goals. Free tool. No signup." />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f1f5f9; min-height: 100vh; padding: 40px 20px; }
  .container { max-width: 700px; margin: 0 auto; background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 16px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
  h1 { font-size: 26px; margin-bottom: 8px; letter-spacing: -0.5px; }
  h1 span { color: #22d3ee; }
  p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 600; }
  .field input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 16px; }
  .field input:focus { outline: none; border-color: #22d3ee; }
  .result-card { margin-top: 32px; padding: 24px; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 2px solid #22d3ee; border-radius: 12px; display: none; }
  .result-card.show { display: block; animation: slideIn 0.4s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .result-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .result-value { font-size: 32px; font-weight: 800; color: #22d3ee; margin-bottom: 8px; }
  .result-breakdown { font-size: 13px; color: #cbd5e1; line-height: 1.6; }
  .result-breakdown b { color: #f1f5f9; }
  .cta { margin-top: 24px; padding: 14px 24px; background: #22d3ee; color: #0f172a; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; }
  .cta:hover { background: #67e8f9; }
  .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #334155; font-size: 11px; color: #64748b; text-align: center; }
  .footer a { color: #22d3ee; text-decoration: none; }
</style>
  <link rel="canonical" href="https://nicholasvormack.github.io/wealth-lab/micro-tools/freelance-rate-calculator/" />
</head>
<body>
<div class="wl-back" style="max-width:860px;margin:0 auto 14px;font-size:13px;"><a href="../../index.html" style="color:#22d3ee;text-decoration:none;">&larr; All Wealth Lab tools</a></div>

<div class="container">
  <h1>Freelance <span>Rate</span> Calculator</h1>
  <p class="sub">Calculate your ideal hourly rate based on annual income goal, expenses, taxes, and billable hours.</p>

  <div class="grid">
    <div class="field">
      <label>Target annual income ($)</label>
      <input type="number" id="income" value="60000" min="0" step="1000" />
    </div>
    <div class="field">
      <label>Annual business expenses ($)</label>
      <input type="number" id="expenses" value="5000" min="0" step="500" />
    </div>
    <div class="field">
      <label>Tax rate (%)</label>
      <input type="number" id="tax" value="25" min="0" max="50" step="1" />
    </div>
    <div class="field">
      <label>Billable hours per week</label>
      <input type="number" id="hours" value="20" min="0" step="1" />
    </div>
  </div>

  <button class="cta" onclick="calculate()">Calculate Hourly Rate</button>

  <div class="result-card" id="result">
    <div class="result-label">Recommended Hourly Rate</div>
    <div class="result-value" id="rate">$0/hr</div>
    <div class="result-breakdown" id="breakdown"></div>
  </div>

  <div class="footer">
    Built by <a href="../../index.html">Wealth Lab</a> — Free micro-tool.
  </div>
</div>

<script>
function calculate() {
  const income = parseFloat(document.getElementById("income").value) || 0;
  const expenses = parseFloat(document.getElementById("expenses").value) || 0;
  const tax = parseFloat(document.getElementById("tax").value) || 0;
  const hours = parseFloat(document.getElementById("hours").value) || 0;

  const weeksPerYear = 50;
  const totalNeeded = income + expenses;
  const preTax = totalNeeded / (1 - tax / 100);
  const billableHours = hours * weeksPerYear;
  const rate = preTax / billableHours;

  const result = document.getElementById("result");
  const rateEl = document.getElementById("rate");
  const breakdown = document.getElementById("breakdown");

  rateEl.textContent = `$${rate.toFixed(2)}/hr`;
  breakdown.innerHTML = `
    <b>Annual income goal:</b> $${income.toFixed(0)}<br>
    <b>Business expenses:</b> $${expenses.toFixed(0)}<br>
    <b>Pre-tax revenue needed:</b> $${preTax.toFixed(0)}<br>
    <b>Billable hours/year:</b> ${billableHours.toFixed(0)}<br>
    <b>Weekly target:</b> $${(preTax / weeksPerYear).toFixed(0)}
  `;
  result.classList.add("show");
}
</script>

</body>
</html>
